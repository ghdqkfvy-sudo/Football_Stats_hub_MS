name: GitHub Pages 배포

# main 에 올라가는 모든 커밋에서 다시 빌드한다 — 코드 변경뿐 아니라
# snapshot.yml / snapshot-leagues.yml 이 10분·1시간 주기로 올리는
# web/public/data/*.json 커밋도 여기 포함되므로, 정적 피드 데이터가
# 항상 배포된 사이트에 그대로 반영된다 (재빌드 없이는 새 JSON이 서빙되지 않음).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 멈춘 Pages 배포 찾기(github-pages 환경의 배포 목록)
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 깨진 데이터가 배포로 넘어가지 않게 막는 마지막 관문.
      # 실패하면 배포가 멈추고 사이트는 직전의 멀쩡한 버전을 계속 보여 준다.
      - name: 데이터 검사
        run: node scripts/check-data.mjs web/public/data

      - name: 의존성 설치
        working-directory: web
        env:
          # playwright 는 로컬 스크린샷용 개발 의존성이다 — CI 에서 브라우저
          # 바이너리(100MB+)까지 내려받을 이유가 없다.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: 빌드
        working-directory: web
        env:
          # 프로젝트 페이지(https://<user>.github.io/<repo>/)용 서브패스.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Cloudflare Worker 를 배포했다면 저장소 Settings → Secrets and
          # variables → Actions → Variables 에 VITE_API_BASE 를 등록해 두면
          # 실시간 프록시 티어가 켜진다. 비워 두면 정적 피드 티어만으로 동작한다.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          # 숨은 "지금 갱신" 시트(RefreshSheet)가 수집 액션을 실행할 저장소
          VITE_GH_REPO: ${{ github.repository }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 멈춘 Pages 배포 정리 (2026-10-20) — 한 배포가 GitHub 쪽에서 updating_pages 로 멈추면
      # deploy-pages 가 10분 뒤 취소를 걸어도 서버에 "진행 중" 으로 남아, 뒤 배포가 전부
      # "in progress deployment … Please cancel <sha> first" 로 실패했다.
      # 이 잡은 concurrency(pages) 로 하나씩만 도니, 지금 진행 중인 Pages 배포는 전부 멈춘 것이다.
      - name: 멈춘 Pages 배포 정리
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 후보: github-pages 환경의 최근 배포 + main 최근 커밋(Pages 배포 id 는 그 커밋 sha)
          cands=$( { gh api "repos/$GH_REPO/deployments?environment=github-pages&per_page=10" --jq '.[].sha' || true;
                     gh api "repos/$GH_REPO/commits?sha=main&per_page=30" --jq '.[].sha' || true; } | awk 'NF && !seen[$0]++')
          # ⚠️ 서버가 이미 deployment_cancelled 라고 답하면서도 새 배포를 막은 적이 있다(10-20 1bc97507) —
          # 그래서 성공(succeed) · 기록 없음이 아니면 전부 취소를 다시 보낸다(끝난 배포면 API 가 거절할 뿐이다)
          for sha in $cands; do
            # ⚠️ 지금 배포할 커밋은 빼야 한다 — 미리 취소를 걸어 두면 곧 만들 배포가 바로 취소된다(10-20 d8b67d22)
            [ "$sha" = "$GITHUB_SHA" ] && continue
            st=$(gh api "repos/$GH_REPO/pages/deployments/$sha" --jq '.status' 2>&1 || true)
            echo "${sha:0:8} ${st}"
            case "$st" in
              succeed|*'Not Found'*) ;;
              *)
                echo "::warning::끝나지 않았을 수 있는 Pages 배포 ${sha} (${st}) — 취소 요청"
                gh api -X POST "repos/$GH_REPO/pages/deployments/$sha/cancel" || true
                ;;
            esac
          done

      - id: deployment
        uses: actions/deploy-pages@v4

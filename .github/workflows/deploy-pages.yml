name: GitHub Pages 배포

# main 에 올라가는 모든 커밋에서 다시 빌드한다 — 코드 변경뿐 아니라
# snapshot.yml / snapshot-leagues.yml 이 10분·1시간 주기로 올리는
# web/public/data/*.json 커밋도 여기 포함되므로, 정적 피드 데이터가
# 항상 배포된 사이트에 그대로 반영된다 (재빌드 없이는 새 JSON이 서빙되지 않음).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 멈춘 Pages 배포 찾기(github-pages 환경의 배포 목록)
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 깨진 데이터가 배포로 넘어가지 않게 막는 마지막 관문.
      # 실패하면 배포가 멈추고 사이트는 직전의 멀쩡한 버전을 계속 보여 준다.
      - name: 데이터 검사
        run: node scripts/check-data.mjs web/public/data

      - name: 의존성 설치
        working-directory: web
        env:
          # playwright 는 로컬 스크린샷용 개발 의존성이다 — CI 에서 브라우저
          # 바이너리(100MB+)까지 내려받을 이유가 없다.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: 빌드
        working-directory: web
        env:
          # 프로젝트 페이지(https://<user>.github.io/<repo>/)용 서브패스.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Cloudflare Worker 를 배포했다면 저장소 Settings → Secrets and
          # variables → Actions → Variables 에 VITE_API_BASE 를 등록해 두면
          # 실시간 프록시 티어가 켜진다. 비워 두면 정적 피드 티어만으로 동작한다.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          # 숨은 "지금 갱신" 시트(RefreshSheet)가 수집 액션을 실행할 저장소
          VITE_GH_REPO: ${{ github.repository }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 멈춘 Pages 배포 정리 (2026-10-20) — 한 배포가 GitHub 쪽에서 updating_pages 로 멈추면
      # deploy-pages 가 10분 뒤 취소를 걸어도 서버에 "진행 중" 으로 남아, 뒤 배포가 전부
      # "in progress deployment … Please cancel <sha> first" 로 실패했다.
      # 이 잡은 concurrency(pages) 로 하나씩만 도니, 지금 진행 중인 Pages 배포는 전부 멈춘 것이다.
      - name: 멈춘 Pages 배포 정리
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 후보: github-pages 환경에 **실제로 만들어진** 최근 배포만.
          # ⚠️ 예전엔 main 최근 커밋 30개에도 취소를 보냈다. 그런데 아직 배포가 없는(더 최신) 커밋에 취소를
          # 보내 두면 그 커밋의 배포가 만들어지자마자 죽어, 상태가 빈 채로 10분 기다리다 실패했다
          # (10-22 #3308 · #3310 연속 실패). 이제 배포 기록이 있는 sha 만 본다.
          for sha in $(gh api "repos/$GH_REPO/deployments?environment=github-pages&per_page=10" --jq '.[].sha' | awk 'NF && !seen[$0]++'); do
            # 지금 배포할 커밋은 빼야 한다 — 미리 취소를 걸어 두면 곧 만들 배포가 바로 취소된다(10-20 d8b67d22)
            [ "$sha" = "$GITHUB_SHA" ] && continue
            st=$(gh api "repos/$GH_REPO/pages/deployments/$sha" --jq '.status' 2>/dev/null || true)
            echo "${sha:0:8} ${st:-(상태 없음)}"
            case "$st" in
              succeed|deployment_cancelled|deployment_failed|deployment_content_failed|deployment_attempt_error|deployment_lost) ;;
              *)
                # 진행 중이거나 상태가 비어 있는 배포(10-20 1bc97507 이 이랬다) — 이 잡이 도는 동안엔 다른 배포가 없으니 멈춘 것
                echo "::warning::멈춘 Pages 배포 ${sha} (${st:-상태 없음}) — 취소"
                gh api -X POST "repos/$GH_REPO/pages/deployments/$sha/cancel" || true
                ;;
            esac
          done

      - id: deployment
        uses: actions/deploy-pages@v4

name: 점검 — 평점 (FotMob)

# FotMob 평점(경기별 · 시즌 평균)이 어디 있는지 본다(2026-10-18). 로그만 남긴다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-ratings.mjs'
      - '.github/workflows/rating-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-ratings.mjs

name: 점검 — 부상명 (FotMob)

# FotMob 부상 번호의 이름이 어디 있는지 본다(2026-10-17). 로그만 남긴다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-injury-names.mjs'
      - '.github/workflows/injury-name-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-injury-names.mjs

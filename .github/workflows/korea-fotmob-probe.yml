name: 점검 — 대표팀 FotMob id

# 대한민국 대표팀의 FotMob 팀 id · 경기 상세 라인업을 본다(2026-10-20). 로그만 남긴다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-korea-fotmob.mjs'
      - '.github/workflows/korea-fotmob-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-korea-fotmob.mjs

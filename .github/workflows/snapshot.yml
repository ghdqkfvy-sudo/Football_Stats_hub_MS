name: 데이터 스냅샷 (팀 일정·뉴스)

# 우리 세 팀의 일정만 뜬다. 6요청이라 자주 돌려도 부담이 없다.
# 리그 전체(20팀 × 2요청)는 snapshot-leagues.yml 에서 1시간 주기로 돈다.
#
# 분(minute)을 정각(0,10,20...)에서 살짝 비켜 뒀다 — GitHub Actions의 schedule
# 트리거는 "최선 노력(best-effort)"이라 매 시 0분처럼 몰리는 시각엔 실행이
# 5~30분씩 밀릴 수 있다(공식 문서에 명시된 동작). 완전히 안 도는 게 아니라
# 그 순간의 혼잡을 피해 지연을 줄이려는 것.
on:
  # 코드를 푸시하면 최신 데이터도 같이 한 번 떠 준다.
  # 봇이 올리는 데이터 커밋으로 다시 돌지 않도록 그 경로는 제외한다.
  push:
    branches: [main]
    paths-ignore:
      - 'web/public/data/**'
      - '**.md'
  schedule:
    # ⚠️ 10분(3,13,23,…)이었는데 한 회차가 그보다 오래 걸려 서로를 취소했다.
    # 실제 소요에 맞춰 20분으로 두는 편이 "10분이라 적어 두고 시간당 3번
    # 갱신되는" 상태보다 정직하고, 결과적으로 더 자주 갱신된다.
    - cron: '3,23,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot
  # ⚠️ 예전에는 cancel-in-progress: true 였다. 그런데 이 잡은 실제로 10분을
  # 넘게 돈다(리그 잡은 실측 15분 — 그 뒤 병렬화로 2026-10 현재 정상 회차는 약 3분). 그러면 **다음 회차가 지금 회차를 죽이고,
  # 죽은 자리를 또 다음 회차가 죽이는** 상태가 되어 끝까지 도는 회차가 드물었다.
  # (커밋 기록을 보면 10분 주기인데 실제 갱신은 시간당 3번뿐이었다.)
  # 겹치면 기다리게 하고, 정말 매달린 회차는 timeout 이 끊는다.
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 매달린 회차가 러너를 붙잡고 있지 않게 한다 (기본값은 6시간이다)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 수집한 JSON 은 main 이 아니라 data 브랜치에 있다(scripts/data-branch.sh) — 작업 폴더에 덮어 놓는다
      - name: 데이터 브랜치 받기
        run: scripts/data-branch.sh pull

      - name: ESPN 팀 일정·뉴스 수집
        run: node scripts/snapshot.mjs web/public/data --only=fast

      # 수집 직후에 한 번 본다 — 깨진 JSON 을 커밋하지 않게
      - name: 산출물 검사
        run: node scripts/check-data.mjs web/public/data

      - name: 변경분을 data 브랜치에 올리기 + Pages 재배포 트리거
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 바뀐 파일만 data 브랜치에 올린다 — main 에는 커밋하지 않는다(코드 이력이 데이터 커밋에 묻혔다).
          # 여러 수집이 동시에 돌아도 서로의 파일을 되돌리지 않는다(scripts/data-branch.sh).
          rc=0
          scripts/data-branch.sh push "chore(data): 팀 일정·뉴스 $(date -u +'%Y-%m-%dT%H:%MZ')" || rc=$?
          if [ "$rc" = 10 ]; then echo "변경 없음"; exit 0; fi
          if [ "$rc" != 0 ]; then exit "$rc"; fi


          # GITHUB_TOKEN으로 한 push는 다른 on:push 워크플로우(Pages 배포)를
          # 자동으로 트리거하지 않는다(무한루프 방지를 위한 GitHub의 기본 동작).
          # 그래서 여기서 명시적으로 deploy-pages.yml 을 한 번 더 돌려준다.
          #
          # ⚠️ 그 전에 멈춘 배포를 치운다. deploy 잡이 GitHub 쪽에서 러너·환경 배정을
          # 못 받고 queued/waiting 으로 몇 시간씩 서 있는 일이 있다(2026-10-05 16시간,
          # 10-06 7시간). 그 run 이 pages 동시성 슬롯을 쥐고 있으면 뒤에 오는 배포가
          # 대기 자리 하나를 두고 서로 밀어내며 전부 취소되고, 사이트가 그 자리에 멈춘다.
          # 정상 배포는 1~2분이라 30분 넘게 안 끝난 run 은 매달린 것으로 보고 끊는다.

          cutoff=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          for st in queued waiting in_progress; do
            gh run list --workflow deploy-pages.yml --status "$st" --limit 20               --json databaseId,createdAt --jq ".[] | select(.createdAt < \"$cutoff\") | .databaseId" |
            while read -r id; do
              echo "::warning::30분 넘게 멈춘 배포 run $id ($st) — 취소한다"
              gh run cancel "$id" || true
            done
          done
          gh workflow run deploy-pages.yml --ref main

      # 오늘의 경기 — 킥오프 75분 전 ~ 150분 뒤의 대상 팀 경기마다 라이브 수집을 띄운다(이미 도는 경기는 건너뜀)
      - name: 라이브 경기 수집 띄우기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/live-detect.mjs web/public/data | while read -r slug espn kickoff; do
            title="라이브 ${slug} ${espn}"
            busy=$(gh run list --workflow live-match.yml --limit 40 --json displayTitle,status \
              --jq "[.[] | select(.displayTitle == \"${title}\" and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\"))] | length")
            if [ "${busy:-0}" != 0 ]; then echo "${title}: 이미 도는 중"; continue; fi
            echo "${title}: 시작 (${kickoff})"
            gh workflow run live-match.yml --ref main -f slug="$slug" -f espn="$espn" -f kickoff="$kickoff" || true
          done

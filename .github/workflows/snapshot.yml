name: 데이터 스냅샷 (팀 일정·뉴스)

# 우리 세 팀의 일정만 뜬다. 6요청이라 자주 돌려도 부담이 없다.
# 리그 전체(20팀 × 2요청)는 snapshot-leagues.yml 에서 1시간 주기로 돈다.
#
# 분(minute)을 정각(0,10,20...)에서 살짝 비켜 뒀다 — GitHub Actions의 schedule
# 트리거는 "최선 노력(best-effort)"이라 매 시 0분처럼 몰리는 시각엔 실행이
# 5~30분씩 밀릴 수 있다(공식 문서에 명시된 동작). 완전히 안 도는 게 아니라
# 그 순간의 혼잡을 피해 지연을 줄이려는 것.
on:
  # 코드를 푸시하면 최신 데이터도 같이 한 번 떠 준다.
  # 봇이 올리는 데이터 커밋으로 다시 돌지 않도록 그 경로는 제외한다.
  push:
    branches: [main]
    paths-ignore:
      - 'web/public/data/**'
      - '**.md'
  schedule:
    # ⚠️ 10분(3,13,23,…)이었는데 한 회차가 그보다 오래 걸려 서로를 취소했다.
    # 실제 소요에 맞춰 20분으로 두는 편이 "10분이라 적어 두고 시간당 3번
    # 갱신되는" 상태보다 정직하고, 결과적으로 더 자주 갱신된다.
    - cron: '3,23,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot
  # ⚠️ 예전에는 cancel-in-progress: true 였다. 그런데 이 잡은 실제로 10분을
  # 넘게 돈다(리그 잡은 실측 15분). 그러면 **다음 회차가 지금 회차를 죽이고,
  # 죽은 자리를 또 다음 회차가 죽이는** 상태가 되어 끝까지 도는 회차가 드물었다.
  # (커밋 기록을 보면 10분 주기인데 실제 갱신은 시간당 3번뿐이었다.)
  # 겹치면 기다리게 하고, 정말 매달린 회차는 timeout 이 끊는다.
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 매달린 회차가 러너를 붙잡고 있지 않게 한다 (기본값은 6시간이다)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ESPN 팀 일정·뉴스 수집
        run: node scripts/snapshot.mjs web/public/data --only=fast

      - name: 변경분 커밋 + Pages 재배포 트리거
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          # 원격을 먼저 당겨 온 다음에 스테이징한다.
          # (예전 순서는 add → pull --rebase --autostash 였는데, autostash 는
          #  되살릴 때 스테이징 상태를 잃어버린다. 그래서 바로 다음 commit 이
          #  "no changes added to commit" 으로 죽고, 데이터가 배포에 한 번도
          #  반영되지 않았다.)
          git pull --rebase --autostash
          git add web/public/data
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(data): 팀 일정·뉴스 $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
            # GITHUB_TOKEN으로 한 push는 다른 on:push 워크플로우(Pages 배포)를
            # 자동으로 트리거하지 않는다(무한루프 방지를 위한 GitHub의 기본 동작).
            # 그래서 여기서 명시적으로 deploy-pages.yml 을 한 번 더 돌려준다.
            gh workflow run deploy-pages.yml --ref main
          fi

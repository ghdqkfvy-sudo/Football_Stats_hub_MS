name: 데이터 스냅샷 (팀 일정·뉴스)

# 우리 세 팀의 일정만 뜬다. 6요청이라 자주 돌려도 부담이 없다.
# 리그 전체(20팀 × 2요청)는 snapshot-leagues.yml 에서 1시간 주기로 돈다.
#
# 분(minute)을 정각(0,10,20...)에서 살짝 비켜 뒀다 — GitHub Actions의 schedule
# 트리거는 "최선 노력(best-effort)"이라 매 시 0분처럼 몰리는 시각엔 실행이
# 5~30분씩 밀릴 수 있다(공식 문서에 명시된 동작). 완전히 안 도는 게 아니라
# 그 순간의 혼잡을 피해 지연을 줄이려는 것.
on:
  # 코드를 푸시하면 최신 데이터도 같이 한 번 떠 준다.
  # 봇이 올리는 데이터 커밋으로 다시 돌지 않도록 그 경로는 제외한다.
  push:
    branches: [main]
    paths-ignore:
      - 'web/public/data/**'
      - '**.md'
  schedule:
    # ⚠️ 10분(3,13,23,…)이었는데 한 회차가 그보다 오래 걸려 서로를 취소했다.
    # 실제 소요에 맞춰 20분으로 두는 편이 "10분이라 적어 두고 시간당 3번
    # 갱신되는" 상태보다 정직하고, 결과적으로 더 자주 갱신된다.
    - cron: '3,23,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot
  # ⚠️ 예전에는 cancel-in-progress: true 였다. 그런데 이 잡은 실제로 10분을
  # 넘게 돈다(리그 잡은 실측 15분). 그러면 **다음 회차가 지금 회차를 죽이고,
  # 죽은 자리를 또 다음 회차가 죽이는** 상태가 되어 끝까지 도는 회차가 드물었다.
  # (커밋 기록을 보면 10분 주기인데 실제 갱신은 시간당 3번뿐이었다.)
  # 겹치면 기다리게 하고, 정말 매달린 회차는 timeout 이 끊는다.
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 매달린 회차가 러너를 붙잡고 있지 않게 한다 (기본값은 6시간이다)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ESPN 팀 일정·뉴스 수집
        run: node scripts/snapshot.mjs web/public/data --only=fast

      # 수집 직후에 한 번 본다 — 깨진 JSON 을 커밋하지 않게
      - name: 산출물 검사
        run: node scripts/check-data.mjs web/public/data

      - name: 변경분 커밋 + Pages 재배포 트리거
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"

          # ⚠️ 예전에는 여기서 `git pull --rebase --autostash` 를 먼저 돌렸다.
          # 그게 2026-09-23 새벽에 사이트의 모든 일정을 비운 원인이다.
          # fast 잡과 leagues 잡은 concurrency 그룹이 달라 이 단계에 동시에
          # 들어올 수 있는데, autostash 가 되살아날 때 같은 파일이 원격에서도
          # 바뀌어 있으면 **충돌 마커(<<<<<<< Updated upstream)가 파일 안에
          # 그대로 남는다**. 그 상태에서 `git add` 가 그걸 담아 커밋·푸시했고,
          # JSON.parse 가 죽어 일정·뉴스가 전부 빈 화면이 됐다.
          #
          # 스냅샷 산출물은 매 회차가 **파일 전체를 새로 쓴다**. 즉 병합할 것이
          # 애초에 없다. 그러니 스태시하지 말고 먼저 커밋한 다음, 원격이 앞서
          # 있으면 우리 커밋을 그 위에 얹는다.
          git add web/public/data
          if git diff --staged --quiet; then
            echo "변경 없음"; exit 0
          fi

          # 마지막 안전핀 — 어떤 경로로 들어왔든 마커가 섞였으면 올리지 않는다.
          # (정상 JSON 한 줄이 통째로 '=======' 일 수는 없다)
          if git grep -nI --cached -E '^(<<<<<<< |=======$|>>>>>>> )' -- web/public/data; then
            echo "::error::충돌 마커가 섞인 데이터가 있다. 커밋하지 않고 멈춘다."
            exit 1
          fi

          git commit -m "chore(data): 팀 일정·뉴스 $(date -u +'%Y-%m-%dT%H:%MZ')"

          # 다른 스냅샷 잡이 먼저 밀어 넣었으면 그 위에 다시 얹고 재시도한다.
          # 데이터 충돌은 항상 **지금 막 뜬 값**(리베이스에서 얹는 쪽 = theirs)이
          # 옳다. 이 커밋은 web/public/data 만 건드리므로 소스에는 닿지 않는다.
          pushed=0
          for i in 1 2 3; do
            if git push; then pushed=1; break; fi
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::리베이스 실패 — 이번 회차는 건너뛴다."
              exit 1
            fi
          done
          if [ "$pushed" != 1 ]; then echo "::error::푸시 3회 실패"; exit 1; fi

          # GITHUB_TOKEN으로 한 push는 다른 on:push 워크플로우(Pages 배포)를
          # 자동으로 트리거하지 않는다(무한루프 방지를 위한 GitHub의 기본 동작).
          # 그래서 여기서 명시적으로 deploy-pages.yml 을 한 번 더 돌려준다.
          gh workflow run deploy-pages.yml --ref main

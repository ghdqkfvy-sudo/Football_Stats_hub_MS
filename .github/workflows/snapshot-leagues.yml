name: 데이터 스냅샷 (리그·스쿼드·코리안리거)

# 리그당 20팀 × 2요청이라 무겁다. 순위는 경기가 끝난 뒤에만 바뀌므로
# 1시간 주기로 충분하다. 급할 때는 workflow_dispatch 로 직접 돌린다.
on:
  # 코드를 푸시하면 리그·스쿼드도 같이 한 번 떠 준다.
  push:
    branches: [main]
    paths-ignore:
      - 'web/public/data/**'
      - '**.md'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot-leagues
  # ⚠️ 예전에는 cancel-in-progress: true 였다. 그런데 이 잡은 실제로 10분을
  # 넘게 돈다(리그 잡은 실측 15분 — 그 뒤 병렬화로 2026-10 현재 정상 회차는 약 3분). 그러면 **다음 회차가 지금 회차를 죽이고,
  # 죽은 자리를 또 다음 회차가 죽이는** 상태가 되어 끝까지 도는 회차가 드물었다.
  # (커밋 기록을 보면 10분 주기인데 실제 갱신은 시간당 3번뿐이었다.)
  # 겹치면 기다리게 하고, 정말 매달린 회차는 timeout 이 끊는다.
  cancel-in-progress: false

jobs:
  leagues:
    runs-on: ubuntu-latest
    # 정상 회차는 약 3분(2026-10 실행 기록). 요청마다 시간 제한(ESPN 10초·사진 5초)이
    # 있어 외부 소스가 느려져도 10분 안쪽에서 끝난다 — 20분을 넘기면 매달린 것이다.
    # (45분이던 때 TheSportsDB 지연으로 세 회차가 45분씩 대기열을 막았다, 2026-10-15)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 손으로 돌린 회차(앱의 숨은 "전체 갱신" 버튼 = workflow_dispatch)는 팀 일정·뉴스
      # (빠른 갱신 항목)까지 같이 뜬다 — 한 번 누르면 전부 최신이 되게. 빠른 쪽은 30초 남짓.
      # 정기 회차는 빠른 잡(snapshot.yml)이 따로 20분마다 돌므로 리그 쪽만 뜬다.
      - name: ESPN 리그·스쿼드·코리안리거 수집
        # TSDB_KEY — TheSportsDB 유료 키(저장소 Secret). 없으면 공개 테스트 키로 간다
        env:
          TSDB_KEY: ${{ secrets.TSDB_KEY }}
        run: node scripts/snapshot.mjs web/public/data --only=${{ github.event_name == 'workflow_dispatch' && 'all' || 'slow' }}

      # 수집 직후에 한 번 본다 — 깨진 JSON 을 커밋하지 않게
      - name: 산출물 검사
        run: node scripts/check-data.mjs web/public/data

      - name: 변경분 커밋 + Pages 재배포 트리거
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"

          # ⚠️ 예전에는 여기서 `git pull --rebase --autostash` 를 먼저 돌렸다.
          # 그게 2026-09-23 새벽에 사이트의 모든 일정을 비운 원인이다.
          # fast 잡과 leagues 잡은 concurrency 그룹이 달라 이 단계에 동시에
          # 들어올 수 있는데, autostash 가 되살아날 때 같은 파일이 원격에서도
          # 바뀌어 있으면 **충돌 마커(<<<<<<< Updated upstream)가 파일 안에
          # 그대로 남는다**. 그 상태에서 `git add` 가 그걸 담아 커밋·푸시했고,
          # JSON.parse 가 죽어 일정·뉴스가 전부 빈 화면이 됐다.
          #
          # 스냅샷 산출물은 매 회차가 **파일 전체를 새로 쓴다**. 즉 병합할 것이
          # 애초에 없다. 그러니 스태시하지 말고 먼저 커밋한 다음, 원격이 앞서
          # 있으면 우리 커밋을 그 위에 얹는다.
          git add web/public/data
          if git diff --staged --quiet; then
            echo "변경 없음"; exit 0
          fi

          # 마지막 안전핀 — 어떤 경로로 들어왔든 마커가 섞였으면 올리지 않는다.
          # (정상 JSON 한 줄이 통째로 '=======' 일 수는 없다)
          if git grep -nI --cached -E '^(<<<<<<< |=======$|>>>>>>> )' -- web/public/data; then
            echo "::error::충돌 마커가 섞인 데이터가 있다. 커밋하지 않고 멈춘다."
            exit 1
          fi

          git commit -m "chore(data): 리그·스쿼드${{ github.event_name == 'workflow_dispatch' && ' + 팀 일정·뉴스' || '' }} $(date -u +'%Y-%m-%dT%H:%MZ')"

          # 다른 스냅샷 잡이 먼저 밀어 넣었으면 그 위에 다시 얹고 재시도한다.
          # 데이터 충돌은 항상 **지금 막 뜬 값**(리베이스에서 얹는 쪽 = theirs)이
          # 옳다. 이 커밋은 web/public/data 만 건드리므로 소스에는 닿지 않는다.
          pushed=0
          for i in 1 2 3; do
            if git push; then pushed=1; break; fi
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::리베이스 실패 — 이번 회차는 건너뛴다."
              exit 1
            fi
          done
          if [ "$pushed" != 1 ]; then echo "::error::푸시 3회 실패"; exit 1; fi

          # GITHUB_TOKEN으로 한 push는 다른 on:push 워크플로우(Pages 배포)를
          # 자동으로 트리거하지 않는다(무한루프 방지를 위한 GitHub의 기본 동작).
          # 그래서 여기서 명시적으로 deploy-pages.yml 을 한 번 더 돌려준다.
          #
          # ⚠️ 그 전에 멈춘 배포를 치운다. deploy 잡이 GitHub 쪽에서 러너·환경 배정을
          # 못 받고 queued/waiting 으로 몇 시간씩 서 있는 일이 있다(2026-10-05 16시간,
          # 10-06 7시간). 그 run 이 pages 동시성 슬롯을 쥐고 있으면 뒤에 오는 배포가
          # 대기 자리 하나를 두고 서로 밀어내며 전부 취소되고, 사이트가 그 자리에 멈춘다.
          # 정상 배포는 1~2분이라 30분 넘게 안 끝난 run 은 매달린 것으로 보고 끊는다.
          cutoff=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          for st in queued waiting in_progress; do
            gh run list --workflow deploy-pages.yml --status "$st" --limit 20               --json databaseId,createdAt --jq ".[] | select(.createdAt < \"$cutoff\") | .databaseId" |
            while read -r id; do
              echo "::warning::30분 넘게 멈춘 배포 run $id ($st) — 취소한다"
              gh run cancel "$id" || true
            done
          done
          gh workflow run deploy-pages.yml --ref main

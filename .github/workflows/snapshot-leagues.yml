name: 데이터 스냅샷 (리그·스쿼드·코리안리거)

# 리그당 20팀 × 2요청이라 무겁다. 순위는 경기가 끝난 뒤에만 바뀌므로
# 1시간 주기로 충분하다. 급할 때는 workflow_dispatch 로 직접 돌린다.
on:
  # 코드를 푸시하면 리그·스쿼드도 같이 한 번 떠 준다.
  push:
    branches: [main]
    paths-ignore:
      - 'web/public/data/**'
      - '**.md'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot-leagues
  cancel-in-progress: true

jobs:
  leagues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ESPN 리그·스쿼드·코리안리거 수집
        run: node scripts/snapshot.mjs web/public/data --only=slow

      - name: 변경분 커밋 + Pages 재배포 트리거
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          # 원격을 먼저 당겨 온 다음에 스테이징한다.
          # (예전 순서는 add → pull --rebase --autostash 였는데, autostash 는
          #  되살릴 때 스테이징 상태를 잃어버린다. 그래서 바로 다음 commit 이
          #  "no changes added to commit" 으로 죽고, 데이터가 배포에 한 번도
          #  반영되지 않았다.)
          git pull --rebase --autostash
          git add web/public/data
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(data): 리그·스쿼드 $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
            # GITHUB_TOKEN으로 한 push는 다른 on:push 워크플로우(Pages 배포)를
            # 자동으로 트리거하지 않는다(무한루프 방지를 위한 GitHub의 기본 동작).
            # 그래서 여기서 명시적으로 deploy-pages.yml 을 한 번 더 돌려준다.
            gh workflow run deploy-pages.yml --ref main
          fi

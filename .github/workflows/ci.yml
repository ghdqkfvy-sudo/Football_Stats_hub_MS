name: 검증 (타입·린트·테스트)

# ⚠️ 왜 필요한가: 예전에는 검증이 배포 워크플로의 `npm run build` 한 줄뿐이었다.
# 그래서 타입 오류나 깨진 테스트를 "사이트가 갱신되지 않는다" 로 알게 됐다.
# 여기서 먼저 걸러야 배포가 조용히 멈추는 일이 없다.
on:
  push:
    branches: [main]
    # 봇이 10분마다 올리는 데이터 커밋으로는 돌지 않는다 (소스가 그대로다)
    paths-ignore:
      - 'web/public/data/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        working-directory: web
        env:
          # playwright 는 로컬 스크린샷용 개발 의존성이다 — CI 에서 브라우저
          # 바이너리(100MB+)까지 내려받을 이유가 없다.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: 타입 검사
        working-directory: web
        run: npm run typecheck

      - name: 린트
        working-directory: web
        run: npm run lint

      - name: 앱 테스트
        working-directory: web
        run: npm test

      - name: 스냅샷 수집기 테스트
        run: node --test scripts/lib/*.test.mjs

      - name: 빌드
        working-directory: web
        run: npm run build

  # 진짜 브라우저로 전 팀 × 전 탭을 데스크톱·폰 폭에서 열어 본다 (web/e2e/smoke.mjs).
  # 타입 검사·단위 테스트로는 안 보이던 사고 — 헤드샷 통째로 깨짐, 섹션이 조용히 빈칸,
  # 가로 넘침, 한 탭이 흰 화면 — 을 사람이 화면을 보기 전에 잡는다.
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      - name: 브라우저 설치 (chromium)
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: 빌드
        working-directory: web
        run: npm run build
      - name: 미리보기 서버
        working-directory: web
        run: |
          # --host 를 안 주면 localhost(::1) 에만 떠서 127.0.0.1 접속이 거부된다.
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          echo '미리보기 서버가 30초 안에 뜨지 않았다' >&2; exit 1
      - name: 화면 스모크
        working-directory: web
        run: node e2e/smoke.mjs http://127.0.0.1:4173/

  # 같은 목록이 코드 두 곳에 있다 — 어긋나면 데이터 파일 이름이 안 맞아
  # 화면이 조용히 "데이터 없음" 으로 떨어진다. 사람이 기억하는 대신 확인한다.
  lists-in-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-lists.mjs
      # 데이터 커밋으로는 이 워크플로가 돌지 않지만(paths-ignore), 소스가
      # 바뀔 때마다 한 번씩은 보는 편이 아무도 안 보는 것보다 낫다.
      - run: node scripts/check-data.mjs web/public/data

name: 검증 (타입·린트·테스트)

# ⚠️ 왜 필요한가: 예전에는 검증이 배포 워크플로의 `npm run build` 한 줄뿐이었다.
# 그래서 타입 오류나 깨진 테스트를 "사이트가 갱신되지 않는다" 로 알게 됐다.
# 여기서 먼저 걸러야 배포가 조용히 멈추는 일이 없다.
on:
  push:
    branches: [main]
    # 봇이 10분마다 올리는 데이터 커밋으로는 돌지 않는다 (소스가 그대로다)
    paths-ignore:
      - 'web/public/data/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        working-directory: web
        env:
          # playwright 는 로컬 스크린샷용 개발 의존성이다 — CI 에서 브라우저
          # 바이너리(100MB+)까지 내려받을 이유가 없다.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: 타입 검사
        working-directory: web
        run: npm run typecheck

      - name: 린트
        working-directory: web
        run: npm run lint

      - name: 앱 테스트
        working-directory: web
        run: npm test

      - name: 스냅샷 수집기 테스트
        run: node --test scripts/lib/*.test.mjs

      - name: 빌드
        working-directory: web
        run: npm run build

  # 같은 목록이 코드 두 곳에 있다 — 어긋나면 데이터 파일 이름이 안 맞아
  # 화면이 조용히 "데이터 없음" 으로 떨어진다. 사람이 기억하는 대신 확인한다.
  lists-in-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-lists.mjs
      # 데이터 커밋으로는 이 워크플로가 돌지 않지만(paths-ignore), 소스가
      # 바뀔 때마다 한 번씩은 보는 편이 아무도 안 보는 것보다 낫다.
      - run: node scripts/check-data.mjs web/public/data

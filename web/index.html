<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070D" />
    <title>MS Stats Hub</title>
    <meta name="description" content="레알 마드리드 · 첼시 · 맨유 · 토트넘 · 뉴캐슬 · 리버풀 · 대한민국 — 일정 · 순위 · 선수 기록을 한국시간으로 보는 축구 통계 허브." />
    <!-- 링크를 메신저에 붙였을 때의 미리보기 카드. 주소가 #해시라 화면마다 다른 카드는 못 만든다 —
         어느 링크든 같은 카드가 뜬다. 그림 주소는 절대 주소여야 해서 빌드가 __SITE_URL__ 을 채운다(vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MS Stats Hub" />
    <meta property="og:title" content="MS Stats Hub" />
    <meta property="og:description" content="일정 · 순위 · 선수 기록을 한국시간으로 — 레알 마드리드 · 프리미어리그 다섯 팀 · 대한민국." />
    <meta property="og:url" content="__SITE_URL__" />
    <!-- 1200×630 — 메신저가 큰 카드로 보여 주는 비율. 512px 정사각 아이콘은 작은 썸네일로만 떴다 -->
    <meta property="og:image" content="__SITE_URL__og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MS Stats Hub — 일정 · 순위 · 선수 기록을 한국시간으로" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__og-card.jpg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS 는 매니페스트의 icons 를 **무시한다** — 이 줄이 없으면 홈 화면에
         추가했을 때 아이콘 자리에 페이지 스크린샷이 박힌다. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MS Stats" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () =>
          navigator.serviceWorker.register('%BASE_URL%sw.js').catch(() => {}),
        );
      }
    </script>
  </body>
</html>
